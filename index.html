<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b63">
<title>Receita Rápida Plantão</title>
<script>
try { var t = localStorage.getItem('rrp_tema'); if (t) document.documentElement.dataset.tema = t; } catch (e) {}
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo">
  <div class="topo-linha">
    <h1 class="titulo">Receita Rápida <span>Plantão</span></h1>
    <div class="topo-acoes">
      <a id="btn-backup" class="btn-icone" href="#/backup" aria-label="Backup">💾</a>
      <button id="btn-tema" class="btn-icone" type="button" aria-label="Alternar modo escuro">🌓</button>
    </div>
  </div>
  <div class="busca">
    <input id="busca" type="text" inputmode="search" enterkeyhint="search"
           placeholder="Buscar condição, sintoma ou CID"
           autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           aria-label="Buscar condição, sintoma ou CID">
    <button id="btn-limpar" class="btn-limpar" type="button" aria-label="Limpar busca" hidden>✕</button>
  </div>
</header>

<main id="app" class="conteudo" aria-live="polite"></main>

<footer class="rodape">Conteúdo de apoio. Revise antes de prescrever.</footer>

<script>
(function () {
  function mostrar(msg) {
    var el = document.getElementById('app');
    if (!el || el.innerHTML.replace(/\s/g, '') !== '') return;
    el.innerHTML =
      '<div class="erro"><h2>O programa não iniciou</h2>' +
      '<p><code>' + String(msg).replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</code></p>' +
      '<ul><li>Confira se o arquivo <b>app.js</b> está na raiz do repositório e completo ' +
      '(termina com <code>carregar();</code> e <code>})();</code>).</li>' +
      '<li>Confira também o final do <b>style.css</b>.</li></ul></div>';
  }
  window.__rrpMostrar = mostrar;
  window.addEventListener('error', function (e) { mostrar(e.message || 'erro desconhecido'); });
  window.setTimeout(function () { mostrar('Nada foi exibido após alguns segundos.'); }, 3000);
})();
</script>
<script src="app.js" onerror="__rrpMostrar('Não encontrei o arquivo app.js.')"></script>
</body>
</html>
